<title>Portafolio Kevin Mendoza</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: una sola página con 4 secciones (Inicio, Experiencia, Proyectos, Contacto). Azul oscuro y blanco dominan (~80%); gris, naranja, amarillo y verde pálidos solo como acentos. Un solo aspecto claro, a propósito. */
:root {
  color-scheme: light;
  --navy: #12294F;
  --navy-soft: #1D3A6C;
  --white: #FFFFFF;
  --gray-dark: #3A404B;
  --gray-light: #E8EAEE;
  --gray-icon: #7F8797;
  --orange: #F7D3B2;
  --yellow: #F6E8AE;
  --green: #C4E3C9;
  --sky: #BFE3F5;
  /* Aparición al hacer scroll: ajusta estos valores */
  --fx-dur: 1.4s;      /* duración del efecto */
  --fx-dist: 18px;     /* distancia que sube al aparecer */
  --fx-blur: 10px;     /* desenfoque inicial */
  --fx-scale: .985;    /* escala inicial */
  --fx-step: .08s;     /* retraso entre elementos del mismo grupo */
  --sh-1: 0 2px 6px rgba(18,41,79,.08), 0 12px 26px -10px rgba(18,41,79,.28);
  --sh-2: 0 4px 10px rgba(18,41,79,.12), 0 24px 44px -14px rgba(18,41,79,.42);
  --sh-sky: 0 6px 14px rgba(18,41,79,.12), 0 30px 54px -18px rgba(38,108,160,.6);
  --sh-sky-h: 0 8px 18px rgba(18,41,79,.16), 0 38px 64px -18px rgba(38,108,160,.75);
  --text: #1B2438;
  --muted: #4B5468;
  --on-navy-muted: #B9C4DA;
  --line: #D6DAE2;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--white); color: var(--text); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
a { color: var(--navy); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
.in { max-width: 1040px; margin: 0 auto; padding-inline: 16px; }
.pad { padding-block: 64px; }
section { scroll-margin-top: 56px; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 34px; text-transform: uppercase; letter-spacing: .03em; margin: 0 0 24px; padding-bottom: 8px; border-bottom: 2px solid currentColor; text-wrap: balance; }
h3 { font-size: 17px; font-weight: 600; margin: 0; }
.meta { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
.lab { font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; margin: 0 0 12px; }

/* Barra superior */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--navy); color: var(--white); border-bottom: 1px solid rgba(255,255,255,.14); }
.top .in { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 20px; padding-block: 10px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; }
.nav { display: flex; flex-wrap: wrap; gap: 2px 20px; }
.nav a { color: var(--on-navy-muted); text-decoration: none; font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding: 4px 0; border-bottom: 2px solid transparent; }
.nav a:hover { color: var(--white); }
.nav a.on { color: var(--white); border-bottom-color: var(--yellow); }
.tools { display: flex; gap: 6px; }
.tools button { background: transparent; border: 1px solid rgba(255,255,255,.4); color: var(--white); border-radius: 3px; padding: 2px 10px; font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; }
.tools button:hover { background: rgba(255,255,255,.12); }
.tools button[aria-pressed="true"] { background: var(--white); color: var(--navy); }

/* Inicio: portada */
.hero { background: var(--navy); color: var(--white); }
.hero .pad { padding-block: 80px 88px; }
.role { font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--yellow); margin: 0 0 12px; }
#name { font-family: var(--font-display); font-weight: 700; font-size: clamp(44px, 9vw, 92px); line-height: .95; margin: 0 0 24px; text-transform: uppercase; text-wrap: balance; }
.lead { max-width: 58ch; font-size: 18px; color: var(--on-navy-muted); margin: 0 0 28px; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,.3); border-radius: 3px; padding: 5px 12px; font-family: var(--font-mono); font-size: 13px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex: none; }

/* Inicio: perfil, background, aspiraciones */
.three { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
@media (min-width: 860px) { .three { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); } }
.pc { border-radius: 6px; padding: 28px; color: var(--navy); min-width: 0; }
.pc.sky { background: linear-gradient(155deg, #D3EDF9 0%, var(--sky) 55%, #A9D8EE 100%); }
.pc .focus { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.pc .focus span { background: var(--white); border-radius: 3px; padding: 2px 12px; font-family: var(--font-mono); font-size: 12.5px; }
.pc p { margin: 0 0 10px; }
.pc p:last-child { margin-bottom: 0; }
.pc ul { margin: 0; padding-left: 18px; }
.pc li { margin-bottom: 4px; }
.pc.t-orange { background: var(--orange); }
.pc.t-yellow { background: var(--yellow); }
.pc.t-green { background: var(--green); }
.sub { margin-top: 48px; }
.sub h3 { font-family: var(--font-display); font-size: 26px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--navy); margin-bottom: 16px; }

/* Habilidades técnicas: iconos grises */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 12px; }
.tile { background: var(--gray-light); border-radius: 4px; padding: 20px 12px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; color: var(--gray-dark); font-size: 14px; font-weight: 500; min-width: 0; }
.tile svg { width: 40px; height: 40px; color: var(--gray-icon); }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font-size: 13.5px; border-radius: 3px; padding: 2px 11px; color: var(--navy); }
.pill.o { background: var(--orange); } .pill.y { background: var(--yellow); } .pill.g { background: var(--green); } .pill.l { background: var(--gray-light); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 24px; margin-top: 24px; }
.two .lab { color: var(--muted); }

/* Experiencia */
#experiencia { background: var(--gray-light); }
#experiencia h2 { color: var(--navy); }
.tl { background: var(--white); border-radius: 4px; padding: 18px; margin-bottom: 32px; }
.tl-axis { position: relative; height: 22px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.tl-axis span { position: absolute; top: 0; padding-left: 4px; border-left: 1px solid var(--line); height: 22px; }
.tl-row { margin-top: 14px; }
.tl-label { margin-bottom: 4px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 10px; }
.tl-label b { font-weight: 600; font-size: 15px; color: var(--navy); }
.tl-track { position: relative; height: 16px; background: repeating-linear-gradient(90deg, transparent 0, transparent calc(100%/3 - 1px), var(--line) calc(100%/3 - 1px), var(--line) calc(100%/3)); }
.tl-bar { position: absolute; top: 0; bottom: 0; border-radius: 2px; border: 1px solid rgba(18,41,79,.45); }
.tone-navy { background: var(--navy); } .tone-green { background: var(--green); } .tone-orange { background: var(--orange); } .tone-yellow { background: var(--yellow); }
.job { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 4px 24px; padding: 24px 0; border-top: 1px solid var(--line); }
@media (max-width: 640px) { .job { grid-template-columns: minmax(0, 1fr); } }
.job h3 { color: var(--navy); font-size: 19px; }
.job ul { margin: 10px 0 0; padding-left: 18px; }
.job li { margin-bottom: 4px; max-width: 70ch; }
.org { color: var(--muted); font-size: 14px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; border: 1px solid rgba(18,41,79,.45); margin-right: 8px; }
.badge { display: inline-block; font-family: var(--font-mono); font-size: 11px; background: var(--navy); color: var(--white); border-radius: 2px; padding: 1px 6px; margin-left: 8px; vertical-align: 2px; letter-spacing: .04em; }

/* Proyectos: franjas blancas sobre azul */
#proyectos { background: var(--navy); color: var(--white); }
.strips { display: flex; flex-direction: column; gap: 10px; }
.strip { background: var(--white); color: var(--navy); }
.sbtn { display: block; width: 100%; background: transparent; border: 0; padding: 0; text-align: left; color: inherit; }
.sbtn:hover { background: #F4F7FB; }
.sbtn:focus-visible { outline: 2px solid var(--navy); outline-offset: -4px; }
.strip .in { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 20px; padding-block: 28px; position: relative; }
.strip .body { display: block; min-width: 0; padding-right: 36px; }
.chev { position: absolute; right: 16px; top: 30px; width: 24px; height: 24px; color: var(--navy); transition: transform .35s ease; }
.strip.open .chev { transform: rotate(180deg); }
.hint { display: block; margin-top: 14px; font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--navy-soft); }
.strip .h-open { display: none; }
.strip.open .h-open { display: inline; }
.strip.open .h-closed { display: none; }
.detail { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .6s cubic-bezier(.22,.61,.36,1); }
.strip.open .detail { grid-template-rows: 1fr; }
.detail > div { overflow: hidden; min-height: 0; visibility: hidden; transition: visibility 0s .6s; }
.strip.open .detail > div { visibility: visible; transition-delay: 0s; }
.detail .in { padding-block: 0 28px; }
.dgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 8px 32px; border-top: 1px solid var(--line); padding-top: 18px; }
.dgrid p { margin: 0 0 6px; color: var(--text); }
.dgrid ul { margin: 0; padding-left: 18px; }
.dgrid li { margin-bottom: 4px; max-width: 60ch; }
h4.k { margin: 10px 0 2px; }
h4.k:first-child { margin-top: 0; }
@media (max-width: 560px) { .strip .in { grid-template-columns: minmax(0, 1fr); gap: 10px; } }
.folder { width: 48px; height: 48px; color: var(--navy); }
.strip .st { display: block; font-family: var(--font-display); font-size: 26px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; line-height: 1.1; }
.strip .meta { display: block; margin-top: 4px; }
.strip .sp { display: block; margin: 10px 0 14px; color: var(--muted); max-width: 68ch; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px 24px; }
.k { display: block; margin: 0 0 6px; font-family: var(--font-mono); font-size: 11.5px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.head-p { padding-block: 64px 28px; }
.head-p h2 { margin: 0; color: var(--white); }
.strips-wrap { padding-bottom: 64px; }

/* Contacto */
#contacto h2 { color: var(--navy); }
.contacts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr)); gap: 16px; }
.cc { background: var(--gray-light); border-radius: 4px; padding: 22px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-width: 0; color: var(--navy); }
.ico { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; }
.ico svg { width: 22px; height: 22px; }
.cc .v { font-family: var(--font-mono); font-size: 15px; overflow-wrap: anywhere; }
.cc .v.off { color: var(--muted); }
.copy { background: var(--white); border: 1px solid var(--line); border-radius: 3px; font-size: 12px; padding: 2px 10px; color: var(--navy); }
.copy:hover { background: var(--navy); color: var(--white); }
.open { font-size: 13px; font-weight: 500; }
footer { background: var(--navy); color: var(--on-navy-muted); padding-block: 24px; font-family: var(--font-mono); font-size: 12px; }

/* Sombras y efectos de tarjetas */
.pc, .tile, .cc, .tl { box-shadow: var(--sh-1); }
.pc.sky { box-shadow: var(--sh-sky); }
.strip { box-shadow: 0 14px 30px -12px rgba(0,0,0,.5); }
.pc:hover, .tile:hover, .cc:hover { box-shadow: var(--sh-2); }
.pc.sky:hover { box-shadow: var(--sh-sky-h); }
.strip:hover { box-shadow: 0 22px 44px -12px rgba(0,0,0,.65); }
.tile svg { transition: transform .35s ease; }
.tile:hover svg { transform: scale(1.12); }

/* Aparición suave y etérea al entrar y salir de la pantalla */
@media (prefers-reduced-motion: no-preference) {
  [data-fx] { --d: calc(var(--i, 0) * var(--fx-step)); transition: opacity var(--fx-dur) ease var(--d), transform var(--fx-dur) cubic-bezier(.22,.61,.36,1) var(--d), filter var(--fx-dur) ease var(--d), box-shadow .35s ease, translate .35s ease; }
  [data-fx].out { opacity: 0; transform: translateY(var(--fx-dist)) scale(var(--fx-scale)); filter: blur(var(--fx-blur)); }
  .pc:hover, .tile:hover, .cc:hover, .strip:hover { translate: 0 -4px; }

  /* Movimiento ambiental */
  .hero { position: relative; overflow: hidden; }
  .hero .in { position: relative; z-index: 1; }
  .hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; pointer-events: none; }
  .hero::before { width: 520px; height: 520px; right: -120px; top: -170px; background: radial-gradient(circle at 35% 35%, rgba(191,227,245,.30), transparent 65%); animation: drift 14s ease-in-out infinite alternate; }
  .hero::after { width: 420px; height: 420px; left: -140px; bottom: -210px; background: radial-gradient(circle at 60% 40%, rgba(196,227,201,.22), transparent 65%); animation: drift2 18s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate(-70px, 55px) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(80px, -40px) scale(1.2); } }

  .dot { animation: pulse 2.2s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(196,227,201,.75); } 100% { box-shadow: 0 0 0 10px rgba(196,227,201,0); } }

  .tile svg { animation: floaty 5s ease-in-out infinite; }
  .tile:nth-child(2) svg { animation-delay: -.8s; } .tile:nth-child(3) svg { animation-delay: -1.6s; }
  .tile:nth-child(4) svg { animation-delay: -2.4s; } .tile:nth-child(5) svg { animation-delay: -3.2s; } .tile:nth-child(6) svg { animation-delay: -4s; }
  @keyframes floaty { 50% { translate: 0 -5px; } }

  .tl-bar { transform-origin: left center; transition: transform 1.3s cubic-bezier(.22,.61,.36,1) .35s; }
  .tl.out .tl-bar { transform: scaleX(0); }
  .tl-bar.tone-navy { animation: glow 2.6s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 0 4px rgba(18,41,79,.16); } }

  .pc.sky { position: relative; overflow: hidden; }
  .pc.sky::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,.55) 50%, transparent 65%); transform: translateX(-120%); }
  .pc.sky:hover::after { animation: sweep 1.1s ease; }
  @keyframes sweep { to { transform: translateX(120%); } }

  .sbtn:hover .folder { animation: wiggle .6s ease; }
  @keyframes wiggle { 25% { rotate: -8deg; } 75% { rotate: 6deg; } }
  .strip:not(.open) .chev { animation: nudge 2.4s ease-in-out infinite; }
  @keyframes nudge { 50% { translate: 0 4px; } }

  .cc:hover .ico { animation: pop .5s ease; }
  @keyframes pop { 40% { scale: 1.2; } }

  .nav a { transition: color .3s ease, border-color .3s ease; }
  .nav a:hover { border-bottom-color: rgba(246,232,174,.6); }
  .brand { transition: letter-spacing .4s ease; }
  .brand:hover { letter-spacing: .14em; }
}

/* Barra de progreso de lectura (solo en navegadores que la admiten) */
@media (prefers-reduced-motion: no-preference) {
  @supports (animation-timeline: scroll()) {
    .top::after { content: ""; position: absolute; left: 0; bottom: -1px; width: 100%; height: 3px; background: linear-gradient(90deg, var(--yellow), var(--sky)); transform-origin: left center; transform: scaleX(0); animation: progress linear both; animation-timeline: scroll(root block); }
    @keyframes progress { to { transform: scaleX(1); } }
  }
}
</style>

<header class="top">
  <div class="in">
    <span class="brand">KM</span>
    <nav class="nav" id="nav" aria-label="Secciones"></nav>
    <div class="tools">
      <button id="lang-es" type="button" aria-pressed="true">ES</button>
      <button id="lang-en" type="button" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<section id="inicio">
  <div class="hero">
    <div class="in pad">
      <p class="role" id="role" data-fx></p>
      <h1 id="name" data-fx style="--d:.08s"></h1>
      <p class="lead" id="summary" data-fx style="--d:.16s"></p>
      <div class="chips" id="chips" data-fx style="--d:.24s"></div>

  <div class="in pad">
    <div class="three" id="three"></div>

</section>

<section id="experiencia"><div class="in pad"><h2 id="h-exp" data-fx></h2><div class="tl" id="timeline" data-fx></div><div id="jobs"></div></div></section>

<section id="proyectos">
  <div class="in head-p"><h2 id="h-proj" data-fx></h2></div>
  <div class="strips strips-wrap" id="projects"></div>
</section>

<section id="contacto"><div class="in pad"><h2 id="h-contact" data-fx></h2><div class="contacts" id="contact"></div></div></section>

<footer><div class="in" id="foot"></div></footer>

<script>

  };

  var ICON = {
    office: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
    chart: '<rect x="4" y="11" width="4" height="9" rx="1"/><rect x="10" y="4" width="4" height="16" rx="1"/><rect x="16" y="8" width="4" height="12" rx="1"/>',
    db: '<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>',

      '<div' + fx(1) + '><h3 class="lab">' + u.lang + '</h3>' + pills(t(D.languages), 'l') + '</div>';

  function renderTimeline() {
    var u = UI[lang], now = nowYM();
    var startY = 2024, endY = 2026, a0 = startY * 12, a1 = (endY + 1) * 12, span = a1 - a0;
    var axis = '';
    for (var y = startY; y <= endY; y++) axis += '<span style="left:' + ((y * 12 - a0) / span * 100) + '%">' + y + '</span>';
    var rows = D.experience.slice().sort(function (a, b) { return mi(a.start) - mi(b.start); }).map(function (j) {
      var s = mi(j.start), e = (j.end ? mi(j.end) : mi(now)) + 1;
      var left = (s - a0) / span * 100, w = Math.max((e - s) / span * 100, 1);
      return '<div class="tl-row"><div class="tl-label"><b>' + esc(t(j.title)) + '</b><span class="meta">' + esc(j.org) + ' · ' + fmt(j.start) + ' – ' + (j.end ? fmt(j.end) : u.present) + '</span></div>' +
        '<div class="tl-track"><div class="tl-bar tone-' + (j.tone || 'navy') + '" style="left:' + left + '%;width:' + w + '%"></div></div></div>';

  }

  function renderJobs() {

  function setupFx() {
    if (!('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (io) io.disconnect();
    var fired = false;
    io = new IntersectionObserver(function (entries) {
      fired = true;
      entries.forEach(function (en) { en.target.classList.toggle('out', !en.isIntersecting); });
    }, { threshold: 0.12 });
    var els = document.querySelectorAll('[data-fx]');
    els.forEach(function (el) { el.classList.add('out'); io.observe(el); });
    setTimeout(function () { if (!fired) els.forEach(function (el) { el.classList.remove('out'); }); }, 1500);
  }
  function markActive(id) {
    window.__active = id;
    document.querySelectorAll('#nav a').forEach(function (a) { a.classList.toggle('on', a.getAttribute('data-id') === id); });
  }
  function setupSpy() {
    if (!('IntersectionObserver' in window) || spy) return;
    spy = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { if (en.isIntersecting) markActive(en.target.id); });
    }, { rootMargin: '-25% 0px -65% 0px' });
    SECTIONS.forEach(function (id) { spy.observe($(id)); });
  }

  function render() { renderTop(); renderHome(); renderTimeline(); renderJobs(); renderProjects(); renderContact(); setupFx(); }

  $('projects').addEventListener('click', function (ev) {
    var b = ev.target.closest('.sbtn'); if (!b) return;
    var i = b.getAttribute('data-i');

    b.closest('.strip').classList.toggle('open', !!openSet[i]);

      var r = document.createRange(); r.selectNodeContents(node);
      var sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    }
    try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (e) { fallback(); }
  });

</script>
