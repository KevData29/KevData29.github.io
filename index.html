    $('xp-view').innerHTML =
      '<div class="xp-panel xp-intro" id="xp-intro"><h2 class="xp-title">' + u.exp + '</h2><div class="xp-years">' + y0 + '-' + y1 + '</div>' +
      '<div class="xp-hint">' + svg('<path d="M15 6l-6 6 6 6"/>', 'xp-chev') + '<span>' + u.pick + '</span></div></div>' +
      jobs.map(function (j, i) {
        return '<article class="xp-panel xp-job" id="xp' + i + '" role="tabpanel" aria-labelledby="xt' + i + '"><h3>' + esc(t(j.title)) + '</h3>' +
          '<p class="xp-org">' + esc(j.org) + ' · ' + esc(j.place) + '</p>' +
          '<p class="xp-when">' + fmt(j.start) + ' – ' + (j.end ? fmt(j.end) : u.present) + '</p><ul>' +
          t(j.bullets).map(function (b, k) { return '<li style="--i:' + k + '">' + esc(b) + '</li>'; }).join('') + '</ul></article>';
      }).join('');
    xpPillOn = false;
    xpSelect(xpSel);
  }
  function xpPill() {
    var nav = $('xp-nav'), pill = $('xp-pill'); if (!nav || !pill) return;
    var tab = xpSel >= 0 ? nav.querySelectorAll('.xp-tab')[xpSel] : null;
    if (!tab) { pill.style.opacity = '0'; xpPillOn = false; return; }
    var a = nav.getBoundingClientRect(), b = tab.querySelector('.xp-label').getBoundingClientRect();
    if (!xpPillOn) pill.style.transition = 'none';
    pill.style.left = (b.left - a.left + nav.scrollLeft - 20) + 'px';
    pill.style.top = (b.top - a.top + nav.scrollTop - 12) + 'px';
    pill.style.width = (b.width + 40) + 'px';
    pill.style.height = (b.height + 24) + 'px';
    pill.style.opacity = '1';
    if (!xpPillOn) { void pill.offsetWidth; pill.style.transition = ''; xpPillOn = true; }
  }
  function xpSelect(i, focus) {
    var jobs = xpJobs(); xpSel = i;
    $('experiencia').setAttribute('data-tone', i < 0 ? 'intro' : xpTheme(jobs[i]));
    document.querySelectorAll('#xp-nav .xp-tab').forEach(function (tb, k) {
      tb.setAttribute('aria-selected', String(k === i));
      tb.setAttribute('tabindex', (k === i || (i < 0 && k === 0)) ? '0' : '-1');
    });
    $('xp-intro').classList.toggle('on', i < 0);
    jobs.forEach(function (j, k) { $('xp' + k).classList.toggle('on', k === i); });
    var nv = $('xp-nav');
    if (i >= 0 && nv.scrollWidth > nv.clientWidth) nv.scrollTo({ left: Math.max(0, $('xt' + i).offsetLeft - 16), behavior: 'smooth' });
    xpPill();
    if (focus && i >= 0) $('xt' + i).focus({ preventScroll: true });
  }
  $('xp-nav').addEventListener('click', function (ev) {
    var b = ev.target.closest('.xp-tab'); if (!b) return;
    var i = +b.getAttribute('data-i');
    xpSelect(xpSel === i ? -1 : i);
  });
  $('xp-nav').addEventListener('keydown', function (ev) {
    var n = xpJobs().length, k = ev.key, i = xpSel;
    if (k === 'ArrowDown' || k === 'ArrowRight') i = i < 0 ? 0 : (i + 1) % n;
    else if (k === 'ArrowUp' || k === 'ArrowLeft') i = i < 0 ? n - 1 : (i - 1 + n) % n;
    else if (k === 'Home') i = 0;
    else if (k === 'End') i = n - 1;
    else if (k === 'Escape') { xpSelect(-1); return; }
    else return;
    ev.preventDefault(); xpSelect(i, true);
  });
  window.addEventListener('resize', function () { xpPillOn = false; xpPill(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { xpPillOn = false; xpPill(); });

  function setupFx() {
    if (!('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (io) io.disconnect();
    var fired = false;
    io = new IntersectionObserver(function (entries) {
      fired = true;
      entries.forEach(function (en) { en.target.classList.toggle('out', !en.isIntersecting); });
    }, { threshold: 0.12 });
    var els = document.querySelectorAll('[data-fx]');
    els.forEach(function (el) { el.classList.add('out'); io.observe(el); });
    setTimeout(function () { if (!fired) els.forEach(function (el) { el.classList.remove('out'); }); }, 1500);
  }
  function markActive(id) {
    window.__active = id;
    document.querySelectorAll('#nav a').forEach(function (a) { a.classList.toggle('on', a.getAttribute('data-id') === id); });
  }
  function setupSpy() {
    if (!('IntersectionObserver' in window) || spy) return;
    spy = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { if (en.isIntersecting) markActive(en.target.id); });
    }, { rootMargin: '-25% 0px -65% 0px' });
    SECTIONS.forEach(function (id) { spy.observe($(id)); });
  }

  function render() { renderTop(); renderHome(); renderExperience(); renderProjects(); renderContact(); setupFx(); }
  render(); setupSpy();

  function setLang(l) { lang = l; try { localStorage.setItem('cv-lang', l); } catch (e) {} render(); }
  $('lang-es').addEventListener('click', function () { setLang('es'); });
  $('lang-en').addEventListener('click', function () { setLang('en'); });
  $('nav').addEventListener('click', function (ev) {
    var a = ev.target.closest('a'); if (!a) return;
    ev.preventDefault();
    var el = $(a.getAttribute('data-id'));
    if (el) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  });
  $('projects').addEventListener('click', function (ev) {
    var b = ev.target.closest('.sbtn'); if (!b) return;
    var i = b.getAttribute('data-i');
    openSet[i] = !openSet[i];
    b.closest('.strip').classList.toggle('open', !!openSet[i]);
    b.setAttribute('aria-expanded', String(!!openSet[i]));
  });
  $('tiles').addEventListener('pointermove', function (ev) {
    var tl = ev.target.closest('.tile'); if (!tl) return;
    var r = tl.getBoundingClientRect();
    tl.style.setProperty('--mx', (ev.clientX - r.left) + 'px');
    tl.style.setProperty('--my', (ev.clientY - r.top) + 'px');
  });
  $('contact').addEventListener('click', function (ev) {
    var b = ev.target.closest('.copy'); if (!b) return;
    var node = $('cv' + b.getAttribute('data-i')), txt = node.textContent, u = UI[lang];
    function done() { b.textContent = u.copied; setTimeout(function () { b.textContent = u.copy; }, 1400); }
    function fallback() {
      var r = document.createRange(); r.selectNodeContents(node);
      var sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    }
    try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (e) { fallback(); }
  });
})();
</script>
</body>
</html>
